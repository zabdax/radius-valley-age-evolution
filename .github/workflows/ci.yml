name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m py_compile code/*.py code/audits/*/*.py figures/make_overview.py figures/make_gate_animation.py
      - run: cd data && sha256sum -c checksums.sha256
      - run: python code/audit_highrep.py
